<script type="text/javascript">
  (function () {
    // A setting is on unless it was explicitly switched off; null ("not set")
    // shows as ticked.
    function on(value) { return value !== false && value !== "false"; }
    RED.nodes.registerType("home-theatre-state-contract", {
      category: "home automation",
      color: "#d9c7f1",
      defaults: {
        name: {value: ""},
        // Required for discovery, and for the default base topic home/<area>/theatre.
        area: {value: "", validate: function (v) {
          var dialog = $("#node-input-discovery").length > 0;
          var discovery = dialog ? $("#node-input-discovery").prop("checked") : on(this.discovery);
          var baseTopic = dialog ? $("#node-input-baseTopic").val() : this.baseTopic;
          return !(discovery || !baseTopic) || Boolean(v && v.trim());
        }},
        // null means "not set": Node-RED fills it into a saved flow from before
        // this setting, which keeps publishing discovery. New nodes start with
        // it off (onadd).
        discovery: {value: null},
        displayName: {value: ""},
        baseTopic: {value: ""},
        discoveryPrefix: {value: "homeassistant", required: true},
        activities: {value: "[]", required: true, validate: function (v) { try { JSON.parse(v); return true; } catch (e) { return false; } }},
        sloWindowSize: {value: 20, required: true, validate: RED.validators.number()},
        sloMinimumSamples: {value: 5, required: true, validate: RED.validators.number()},
        sloLatencyBudgetMs: {value: 60000, required: true, validate: RED.validators.number()},
        sloSuccessObjectivePct: {value: 95, required: true, validate: RED.validators.number()}
      },
      onadd: function () {
        this.discovery = false;
      },
      oneditprepare: function () {
        $("#node-input-discovery").prop("checked", on(this.discovery));
        $("#node-input-discovery, #node-input-baseTopic").on("change keyup", function () {
          $("#node-input-area").trigger("change");
        });
      },
      inputs: 1,
      outputs: 2,
      outputLabels: ["activity requests", "retained MQTT state and HA discovery"],
      icon: "font-awesome/fa-exchange",
      label: function() { return this.name || "theatre state contract"; }
    });
  })();
</script>

<script type="text/html" data-template-name="home-theatre-state-contract">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-area">Area</label><input type="text" id="node-input-area"></div>
  <div class="form-row"><label for="node-input-displayName">Display name</label><input type="text" id="node-input-displayName"></div>
  <div class="form-row"><label for="node-input-baseTopic">Base topic</label><input type="text" id="node-input-baseTopic"></div>
  <div class="form-row"><label for="node-input-discovery">Home Assistant discovery</label><input type="checkbox" id="node-input-discovery" style="display:inline-block; width:auto;"></div>
  <div class="form-row"><label for="node-input-discoveryPrefix">Discovery prefix</label><input type="text" id="node-input-discoveryPrefix"></div>
  <div class="form-row"><label for="node-input-activities">Activities JSON</label><input type="text" id="node-input-activities"></div>
  <div class="form-row"><label for="node-input-sloWindowSize">SLO window</label><input type="number" id="node-input-sloWindowSize"></div>
  <div class="form-row"><label for="node-input-sloMinimumSamples">Minimum samples</label><input type="number" id="node-input-sloMinimumSamples"></div>
  <div class="form-row"><label for="node-input-sloLatencyBudgetMs">Latency budget (ms)</label><input type="number" id="node-input-sloLatencyBudgetMs"></div>
  <div class="form-row"><label for="node-input-sloSuccessObjectivePct">Success objective (%)</label><input type="number" id="node-input-sloSuccessObjectivePct"></div>
</script>

<script type="text/html" data-help-name="home-theatre-state-contract">
  <p>Bridges non-retained MQTT activity requests to the theatre controller and publishes retained controller truth.</p>
  <p>Requests arrive on <code>&lt;base&gt;/request</code> with a request ID and activity. Retained requests are inert. Complete <code>msg.theatre</code> state snapshots publish desired, current, phase, failure, availability, operational SLO and per-target health topics. </p>
  <p>With <b>Home Assistant discovery</b> on, a startup event also publishes discovery for the activity selector and
    status sensors; switched off, it clears them, so Home Assistant removes them. New nodes start with it off; a node
    saved before the setting existed keeps it on.</p>
  <p>The <b>Area</b> names the discovery entities and the default base topic <code>home/&lt;area&gt;/theatre</code>,
    so it is needed when discovery is on or the base topic is empty. With discovery off and a base topic set, it is
    optional.</p>
</script>
