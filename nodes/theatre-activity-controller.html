<script type="text/javascript">
  RED.nodes.registerType("home-theatre-activity-controller", {
    category: "function",
    color: "#d9c7f1",
    defaults: {
      name: {value: ""},
      area: {value: "lounge", required: true},
      freshnessMs: {value: 30000, required: true, validate: RED.validators.number()},
      activityProfiles: {value: "{}", required: true}
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["semantic target commands", "activity state and events"],
    icon: "font-awesome/fa-sitemap",
    label: function() { return this.name || "theatre activity"; }
  });
</script>

<script type="text/html" data-template-name="home-theatre-activity-controller">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-area">Area</label><input type="text" id="node-input-area"></div>
  <div class="form-row"><label for="node-input-freshnessMs">Freshness ms</label><input type="number" id="node-input-freshnessMs"></div>
  <div class="form-row"><label for="node-input-activityProfiles">Profiles JSON</label><input type="text" id="node-input-activityProfiles"></div>
</script>

<script type="text/html" data-help-name="home-theatre-activity-controller">
  <p>Owns latest-request-wins whole-theatre activity state and aggregates generation-scoped target evidence.</p>
  <p>Input <code>msg.theatre</code> accepts activity intent, target-state, startup, refresh and tick events. Output 1 emits semantic <code>msg.theatreCommand</code> messages for target owners. Output 2 emits activity events and a complete state snapshot. Device transports remain separate.</p>
</script>
