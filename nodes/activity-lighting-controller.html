<script type="text/javascript">
  RED.nodes.registerType("home-activity-lighting-controller", {
    category: "home automation",
    color: "#c7d9f1",
    defaults: {
      name: {value: ""},
      area: {value: ""},
      // User data with no sensible default: empty until the user fills it in,
      // and marked invalid until then, as the runtime rejects it.
      profiles: {value: "{}", required: true, validate: function (v) { try { var parsed = JSON.parse(v); return Boolean(parsed) && typeof parsed === "object" && !Array.isArray(parsed) && Object.keys(parsed).length > 0; } catch (e) { return false; } }},
      owner: {value: "activity", required: true},
      confirmationTimeoutMs: {value: 15000, required: true, validate: RED.validators.number()},
      maxAttempts: {value: 2, required: true, validate: RED.validators.number()},
      // The room's targets marked onOffOnly: none unless set.
      onOffOnlyTargets: {value: "[]", validate: function (v) { try { var parsed = JSON.parse(v || "[]"); return Array.isArray(parsed) && parsed.every(function (t) { return typeof t === "string"; }); } catch (e) { return false; } }}
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["room-lighting commands", "theatre target state"],
    icon: "font-awesome/fa-lightbulb-o",
    label: function() { return this.name || "activity lighting"; }
  });
</script>

<script type="text/html" data-template-name="home-activity-lighting-controller">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-area">Area</label><input type="text" id="node-input-area"></div>
  <div class="form-row"><label for="node-input-profiles">Profiles JSON</label><input type="text" id="node-input-profiles"></div>
  <div class="form-row"><label for="node-input-owner">Owner</label><input type="text" id="node-input-owner" placeholder="activity"></div>
  <div class="form-row"><label for="node-input-confirmationTimeoutMs">Confirm ms</label><input type="number" id="node-input-confirmationTimeoutMs"></div>
  <div class="form-row"><label for="node-input-maxAttempts">Attempts</label><input type="number" id="node-input-maxAttempts"></div>
  <div class="form-row"><label for="node-input-onOffOnlyTargets">On/off-only targets</label><input type="text" id="node-input-onOffOnlyTargets" placeholder="[]"></div>
</script>

<script type="text/html" data-help-name="home-activity-lighting-controller">
  <p>Applies configuration-owned activity styles only to room lights that are already on and not manually owned.</p>
  <p>Input <code>msg.activityLighting</code> carries generation-scoped intent, observation, refresh, result or tick events. Output 1 emits standard <code>msg.lighting</code> intents for a room controller. Output 2 emits theatre <code>target_state</code> evidence. Room-light failure is optional degradation, not activity success.</p>
  <p>Each profile is <code>{targets: [...], values: {...}}</code>, with <code>values</code> in the package's own units:
    <code>brightnessPct</code> (0-100) and <code>colorTempKelvin</code>, for example
    <code>{"tv": {"targets": ["main"], "values": {"brightnessPct": 25, "colorTempKelvin": 2500}}}</code>.
    <code>brightnessPct</code> runs from 0 (the dimmest the light goes, not off) to 100, and
    <code>colorTempKelvin</code> must be above 0; anything else is an invalid configuration. The room
    controller converts them for the light, and a light's report (in its own units) is compared after the same
    conversion. Zigbee2MQTT's own <code>brightness</code> and <code>color_temp</code> were removed in 6.0: a profile
    using them is an invalid configuration.</p>
  <p><b>On/off-only targets</b>: a JSON list of the room's targets marked <code>onOffOnly</code>, such as
    <code>["lamp"]</code>. Such a light reports no brightness or colour, so the activity confirms it once it is on,
    rather than waiting for values it can't show. The room leaves out any values a profile gives it, and this node
    logs a warning once per deploy naming the profile and light. List the same lights as the room's
    <code>onOffOnly</code> targets: a light marked only on the room never confirms here, and this node warns once per
    deploy when a light is on but reports none of the profile's values.</p>
  <p>While a profile is active, its lights are overridden in the room controller under <b>Owner</b>
    (default <code>activity</code>), so the room's style (from a circadian lighting policy) leaves the activity's alone. When a new profile
    no longer includes a light, including a switch to an off profile with no targets, the node emits
    <code>{kind: "release", owner, targets}</code> for those lights and the room controller restyles them.
    Give each activity-lighting node that feeds the same room controller its own owner.</p>
</script>
