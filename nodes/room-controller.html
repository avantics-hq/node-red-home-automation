<script type="text/javascript">
  RED.nodes.registerType("home-room-lighting-controller", {
    category: "home automation",
    color: "#ffd27f",
    defaults: {
      name: {value: ""},
      area: {value: "room", required: true},
      displayName: {value: "Room", required: true},
      targets: {value: "[]", required: true},
      maxBrightnessPct: {value: 100, required: true, validate: RED.validators.number()},
      maxColorTempKelvin: {value: 6500, required: true, validate: RED.validators.number()},
      sleepBrightnessPct: {value: 1, required: true, validate: RED.validators.number()},
      sleepColorTempKelvin: {value: 2200, required: true, validate: RED.validators.number()},
      initialTransitionSeconds: {value: 1, required: true, validate: RED.validators.number()},
      refreshTransitionSeconds: {value: 60, required: true, validate: RED.validators.number()},
      refreshSeconds: {value: 60, required: true, validate: RED.validators.number()},
      initialSleep: {value: false},
      wakeTime: {value: "07:00", required: true, validate: function (v) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(v); }},
      bedTime: {value: "23:00", required: true, validate: function (v) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(v); }}
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-lightbulb-o",
    label: function () { return this.name || this.area + " lighting controller"; }
  });
</script>

  <div class="form-row"><label for="node-input-maxColorTempKelvin">Daytime kelvin</label><input type="number" id="node-input-maxColorTempKelvin"></div>

<script type="text/html" data-help-name="home-room-lighting-controller">
  <p>Owns room MQTT commands, adaptive colour and brightness, manual overrides, discovery and bounded tracing.</p>
  <h3>Circadian schedule</h3>
  <p>Circadian levels follow <b>Wake time</b> and <b>Bed time</b> (24-hour <code>HH:MM</code>, default 07:00 and
    23:00): they rise to the daytime level over the hour after waking, stay at the daytime brightness and colour
    through the day, wind down to the sleep settings over the three hours before bed, and stay at the sleep
    settings until you wake. A bed time after midnight, or a wake time later than the bed time, works. Sleep mode
    still overrides the schedule.</p>
  <p>Times are the Node-RED host's local time. Docker containers default to UTC: set the container's
    <code>TZ</code> if your host should follow a local timezone.</p>
  <h3>Control state</h3>
  <p>Each target has one control state:</p>
  <dl class="message-properties">
    <dt>in-control</dt><dd>circadian lighting may style and refresh the light. This is the default.</dd>
    <dt>overridden</dt><dd>another owner, such as an activity or a scene, holds the light. Refresh and circadian
      changes leave it alone until that owner releases it.</dd>
    <dt>manual</dt><dd>a person changed the light. Enabling circadian lighting returns manual lights to
      in-control.</dd>
  </dl>
  <p>An overridden light changes only for an intent with an <code>owner</code> (its own, or a newer owner who takes
    it over), a person (a <code>manual: true</code> intent, <code>person: true</code>, set by the wall-switch policies, an external command on the command topic, or a change
    seen at the light), or a release. Any other intent, including motion ON or OFF and owner-less values, leaves it
    alone and is traced as <code>ignored held-by</code>; other targets in the same intent are still handled.
    Switching a light off by its owner or a person returns it to in-control.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>lighting.owner <span class="property-type">string</span></dt>
    <dd>on an <code>intent</code> that switches targets on, marks them overridden by this owner. With
      <code>preserveManual: true</code>, manual lights are skipped.</dd>
    <dt>lighting.kind = "release"</dt>
    <dd>returns overridden <code>targets</code> (default: all) to in-control. With <code>owner</code>, only lights
      held by that owner are released. Released lights that are on are restyled as a refresh would.</dd>
  </dl>
  <h3>Outputs</h3>
  <p>On startup and whenever a target's control state changes, a retained message is sent with topic
    <code>home/&lt;area&gt;/lighting/&lt;target&gt;/control</code> and payload
    <code>{"state": "in-control" | "overridden" | "manual", "owner": string | null}</code>.</p>
</script>
