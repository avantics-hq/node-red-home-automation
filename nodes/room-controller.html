<script type="text/javascript">
  (function () {
    // A setting is on unless it was explicitly switched off.
    function on(value) { return value !== false && value !== "false"; }
    RED.nodes.registerType("home-room-lighting-controller", {
      category: "home automation",
      color: "#ffd27f",
      defaults: {
        name: {value: ""},
        // Required only when the room publishes something named after it.
        area: {value: "", validate: function (v) {
          var publishing = $("#node-input-publishState").length
            ? $("#node-input-publishState").prop("checked") || $("#node-input-discovery").prop("checked")
            : on(this.publishState) || on(this.discovery);
          return !publishing || Boolean(v && v.trim());
        }},
        // Empty means "not set": a saved flow from before these settings keeps
        // publishing. New nodes start with both off (onadd).
        publishState: {value: ""},
        discovery: {value: ""},
        displayName: {value: ""},
        targets: {value: "[]", required: true},
        maxBrightnessPct: {value: 100, required: true, validate: RED.validators.number()},
        maxColorTempKelvin: {value: 6500, required: true, validate: RED.validators.number()},
        sleepBrightnessPct: {value: 1, required: true, validate: RED.validators.number()},
        sleepColorTempKelvin: {value: 2200, required: true, validate: RED.validators.number()},
        initialTransitionSeconds: {value: 1, required: true, validate: RED.validators.number()},
        refreshTransitionSeconds: {value: 60, required: true, validate: RED.validators.number()},
        refreshSeconds: {value: 60, required: true, validate: RED.validators.number()},
        initialSleep: {value: false},
        wakeTime: {value: "07:00", required: true, validate: function (v) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(v); }},
        bedTime: {value: "23:00", required: true, validate: function (v) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(v); }}
      },
      onadd: function () {
        this.publishState = false;
        this.discovery = false;
      },
      oneditprepare: function () {
        var node = this;
        $("#node-input-publishState").prop("checked", on(node.publishState));
        $("#node-input-discovery").prop("checked", on(node.discovery));
        // Discovery describes the published state, so it needs it.
        function follow() {
          var publishing = $("#node-input-publishState").prop("checked");
          if (!publishing) $("#node-input-discovery").prop("checked", false);
          $("#node-input-discovery").prop("disabled", !publishing);
          $("#node-input-area").trigger("change");
        }
        $("#node-input-publishState, #node-input-discovery").on("change", follow);
        follow();
      },
      inputs: 1,
      outputs: 1,
      icon: "font-awesome/fa-lightbulb-o",
      label: function () { return this.name || (this.area ? this.area + " " : "") + "lighting controller"; }
    });
  })();
</script>

<script type="text/html" data-template-name="home-room-lighting-controller">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-area">Area</label><input type="text" id="node-input-area" placeholder="needed when publishing"></div>
  <div class="form-row"><label for="node-input-publishState">Publish state over MQTT</label><input type="checkbox" id="node-input-publishState" style="display:inline-block; width:auto;"></div>
  <div class="form-row"><label for="node-input-discovery">Home Assistant discovery</label><input type="checkbox" id="node-input-discovery" style="display:inline-block; width:auto;"> <span>(needs Publish state)</span></div>
  <div class="form-row"><label for="node-input-displayName">Display name</label><input type="text" id="node-input-displayName"></div>
  <div class="form-row"><label for="node-input-targets">Targets JSON</label><input type="text" id="node-input-targets"></div>
  <div class="form-row"><label for="node-input-maxBrightnessPct">Daytime brightness %</label><input type="number" id="node-input-maxBrightnessPct"></div>
  <div class="form-row"><label for="node-input-maxColorTempKelvin">Daytime kelvin</label><input type="number" id="node-input-maxColorTempKelvin"></div>
  <div class="form-row"><label for="node-input-sleepBrightnessPct">Sleep brightness %</label><input type="number" id="node-input-sleepBrightnessPct"></div>
  <div class="form-row"><label for="node-input-sleepColorTempKelvin">Sleep kelvin</label><input type="number" id="node-input-sleepColorTempKelvin"></div>
  <div class="form-row"><label for="node-input-initialTransitionSeconds">Initial transition seconds</label><input type="number" id="node-input-initialTransitionSeconds"></div>
  <div class="form-row"><label for="node-input-refreshTransitionSeconds">Refresh transition seconds</label><input type="number" id="node-input-refreshTransitionSeconds"></div>
  <div class="form-row"><label for="node-input-refreshSeconds">Refresh interval seconds</label><input type="number" id="node-input-refreshSeconds"></div>
  <div class="form-row"><label for="node-input-wakeTime">Wake time</label><input type="text" id="node-input-wakeTime" placeholder="07:00"></div>
  <div class="form-row"><label for="node-input-bedTime">Bed time</label><input type="text" id="node-input-bedTime" placeholder="23:00"></div>
  <div class="form-row"><label for="node-input-initialSleep">Initial sleep mode</label><input type="checkbox" id="node-input-initialSleep" style="display:inline-block; width:auto;"></div>
</script>

<script type="text/html" data-help-name="home-room-lighting-controller">
  <p>Owns room MQTT commands, adaptive colour and brightness, manual overrides, discovery and bounded tracing.</p>
  <h3>Publishing</h3>
  <p>The room always commands its lights on each target's own command topic. Two settings add what it publishes
    for other systems to see; both are named after the <b>Area</b>, which is needed only when one of them is on.</p>
  <dl class="message-properties">
    <dt>Publish state over MQTT</dt><dd>each light's control state on
      <code>home/&lt;area&gt;/lighting/&lt;target&gt;/control</code> and the circadian state on
      <code>home/&lt;area&gt;/circadian/state</code>.</dd>
    <dt>Home Assistant discovery</dt><dd>a circadian switch in Home Assistant, which reads that state and sends
      ON/OFF to <code>home/&lt;area&gt;/circadian/set</code>. It needs <b>Publish state</b>. Switching it off
      removes the switch from Home Assistant at the next start.</dd>
  </dl>
  <p>New nodes start with both off. A node saved before these settings existed keeps publishing both.</p>
  <h3>Circadian schedule</h3>
  <p>Circadian levels follow <b>Wake time</b> and <b>Bed time</b> (24-hour <code>HH:MM</code>, default 07:00 and
    23:00): they rise to the daytime level over the hour after waking, stay at the daytime brightness and colour
    through the day, wind down to the sleep settings over the three hours before bed, and stay at the sleep
    settings until you wake. A bed time after midnight, or a wake time later than the bed time, works. Sleep mode
    still overrides the schedule.</p>
  <p>Times are the Node-RED host's local time. Docker containers default to UTC: set the container's
    <code>TZ</code> if your host should follow a local timezone.</p>
  <h3>Control state</h3>
  <p>Each target has one control state:</p>
  <dl class="message-properties">
    <dt>in-control</dt><dd>circadian lighting may style and refresh the light. This is the default.</dd>
    <dt>overridden</dt><dd>another owner, such as an activity or a scene, holds the light. Refresh and circadian
      changes leave it alone until that owner releases it.</dd>
    <dt>manual</dt><dd>a person changed the light. Enabling circadian lighting returns manual lights to
      in-control.</dd>
  </dl>
  <p>An overridden light changes only for an intent with an <code>owner</code> (its own, or a newer owner who takes
    it over), a person (a <code>manual: true</code> intent, <code>person: true</code>, set by the wall-switch policies, an external command on the command topic, or a change
    seen at the light), or a release. Any other intent, including motion ON or OFF and owner-less values, leaves it
    alone and is traced as <code>ignored held-by</code>; other targets in the same intent are still handled.
    Switching a light off by its owner or a person returns it to in-control.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>lighting.owner <span class="property-type">string</span></dt>
    <dd>on an <code>intent</code> that switches targets on, marks them overridden by this owner. With
      <code>preserveManual: true</code>, manual lights are skipped.</dd>
    <dt>lighting.kind = "release"</dt>
    <dd>returns overridden <code>targets</code> (default: all) to in-control. With <code>owner</code>, only lights
      held by that owner are released. Released lights that are on are restyled as a refresh would.</dd>
  </dl>
  <h3>Outputs</h3>
  <p>With <b>Publish state</b> on, on startup and whenever a target's control state changes, a retained message is
    sent with topic
    <code>home/&lt;area&gt;/lighting/&lt;target&gt;/control</code> and payload
    <code>{"state": "in-control" | "overridden" | "manual", "owner": string | null}</code>.</p>
</script>
