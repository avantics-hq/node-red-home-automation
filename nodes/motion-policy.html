<script type="text/javascript">
  (function () {
  function on(value) { return value === true || value === "true"; }
  RED.nodes.registerType("home-motion-lighting-policy", {
    category: "home automation",
    color: "#d8bfd8",
    defaults: {
      name: {value: ""},
      // Required only when the node publishes, and then with a letter or
      // digit, from which its topics and IDs are made.
      area: {value: "", validate: function (v) {
        var publishing = $("#node-input-publishState").length ? $("#node-input-publishState").prop("checked") : on(this.publishState);
        return !publishing || /[a-z0-9]/i.test(String(v || ""));
      }},
      onTargets: {value: "[\"main\"]", required: true, validate: function (v) { try { JSON.parse(v); return true; } catch (e) { return false; } }},
      offTargets: {value: "[\"main\"]", required: true, validate: function (v) { try { JSON.parse(v); return true; } catch (e) { return false; } }},
      defaultDelaySeconds: {value: 120, required: true, validate: RED.validators.number()},
      defaultIlluminanceCutoff: {value: 10, required: true, validate: RED.validators.number()},
      // Motion published nothing before these settings, so both start off.
      publishState: {value: false},
      discovery: {value: false},
      discoveryPrefix: {value: "homeassistant", required: true, validate: function (v) { var prefix = String(v || "").trim().replace(/^\/+|\/+$/g, ""); return Boolean(prefix) && !/[+#]/.test(prefix); }},
      // How Home Assistant IDs are named; motion has no older entities, so not
      // set also means "node".
      idScheme: {value: null}
    },
    onadd: function () {
      this.idScheme = "node";
    },
    oneditprepare: function () {
      $("#node-input-publishState").prop("checked", on(this.publishState));
      $("#node-input-discovery").prop("checked", on(this.discovery));
      // Discovery describes the published state, so it needs it.
      function follow() {
        var publishing = $("#node-input-publishState").prop("checked");
        if (!publishing) $("#node-input-discovery").prop("checked", false);
        $("#node-input-discovery").prop("disabled", !publishing);
        $("#node-input-area").trigger("change");
      }
      $("#node-input-publishState, #node-input-discovery").on("change", follow);
      follow();
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["lighting intents", "MQTT publications"],
    icon: "font-awesome/fa-lightbulb-o",
    label: function () { return this.name || (this.area ? this.area + " " : "") + "motion policy"; }
  });
  })();
</script>

<script type="text/html" data-template-name="home-motion-lighting-policy">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-area">Area</label><input type="text" id="node-input-area"></div>
  <div class="form-row"><label for="node-input-onTargets">ON targets</label><input type="text" id="node-input-onTargets"></div>
  <div class="form-row"><label for="node-input-offTargets">OFF targets</label><input type="text" id="node-input-offTargets"></div>
  <div class="form-row"><label for="node-input-defaultDelaySeconds">Vacancy seconds</label><input type="number" id="node-input-defaultDelaySeconds"></div>
  <div class="form-row"><label for="node-input-defaultIlluminanceCutoff">Lux cutoff</label><input type="number" id="node-input-defaultIlluminanceCutoff"></div>
  <div class="form-row"><label for="node-input-publishState">Publish state over MQTT</label><input type="checkbox" id="node-input-publishState" style="display:inline-block; width:auto;"></div>
  <div class="form-row"><label for="node-input-discovery">Home Assistant discovery</label><input type="checkbox" id="node-input-discovery" style="display:inline-block; width:auto;"> <span>(needs Publish state)</span></div>
  <div class="form-row"><label for="node-input-discoveryPrefix">Discovery prefix</label><input type="text" id="node-input-discoveryPrefix"></div>
</script>

<script type="text/html" data-help-name="home-motion-lighting-policy">
  <p>Turns normalised occupancy, illuminance and enable-state events into <code>msg.lighting</code> intents: ON when
    the room is occupied and dark enough, and OFF once it has been vacant for the vacancy time. The OFF intent carries
    <code>vacantSince</code>, so the room lighting controller keeps any light a person set after the room went
    vacant.</p>
  <p>Wall switches go to the <b>switch lighting policy</b> node, not here; switch messages sent to this node are
    ignored.</p>
  <h3>Inputs</h3>
  <p>Each message names its kind in <code>msg.source</code>:</p>
  <dl class="message-properties">
    <dt>occupancy</dt><dd><code>msg.payload.occupied</code>, from the occupancy fusion node.</dd>
    <dt>illuminance</dt><dd>the light level in lux.</dd>
    <dt>area-enabled</dt><dd>ON or OFF for this node; <code>global-enabled</code> for every motion node.</dd>
    <dt>delay</dt><dd>a new vacancy time, in <b>seconds</b>, the same unit as <b>Vacancy seconds</b>.</dd>
    <dt>illuminance-cut-off</dt><dd>a new lux cutoff.</dd>
  </dl>
  <p>A <code>delay</code> or <code>illuminance-cut-off</code> message overrides the setting, and lasts across
    restarts until the node is deployed with a different <b>Vacancy seconds</b> or <b>Lux cutoff</b>, which then
    applies.</p>
  <h3>Publishing</h3>
  <p>Off unless switched on, and then named after the <b>Area</b>, which is needed.</p>
  <dl class="message-properties">
    <dt>Publish state over MQTT</dt><dd>whether this node's motion lighting is enabled, retained <code>ON</code> or
      <code>OFF</code> on <code>home/&lt;area&gt;/motion/enabled/state</code>, and its vacancy delay in seconds on
      <code>home/&lt;area&gt;/motion/delay/state</code>, with <code>online</code> or <code>offline</code> on
      <code>home/&lt;area&gt;/motion/availability</code>. It acts on <code>ON</code>/<code>OFF</code> sent to
      <code>…/enabled/set</code> and a delay of 0 to 86400 seconds sent to <code>…/delay/set</code>, as the
      <code>area-enabled</code> and <code>delay</code> inputs do; wire an MQTT in node on
      <code>home/&lt;area&gt;/motion/+/set</code> into this node. The shared <code>global-enabled</code> is not
      published, and the switch shows this node's enable only, so motion can still be off everywhere while it
      shows on.</dd>
    <dt>Home Assistant discovery</dt><dd>a motion lighting switch and a vacancy delay number (in the device's
      configuration). It needs <b>Publish state</b>.</dd>
  </dl>
  <p>These go on the second output; wire it to an MQTT out node. The node announces itself once the flows have
    started, and again when it receives <code>msg.source = "startup"</code>.</p>
  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>Lighting intents, for the room lighting controller.</li>
    <li>MQTT publications, when publishing is on.</li>
  </ol>
</script>
