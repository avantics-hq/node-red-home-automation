<script type="text/javascript">
  (function () {
    // Whether the node publishes, from the open dialog or its saved settings.
    function publishes(node) {
      function on(value) { return value === true || value === "true"; }
      var state = $("#node-input-publishState");
      var discovery = $("#node-input-discovery");
      return state.length ? state.prop("checked") || discovery.prop("checked") : on(node.publishState) || on(node.discovery);
    }
    RED.nodes.registerType("home-cover-controller", {
      category: "home automation",
      color: "#e2d96e",
      defaults: {
        // A marker only a node new from the palette has, as core nodes do: import
        // and paste keep the saved name, so onadd leaves a saved node's settings.
        name: {value: "_DEFAULT_"},
        area: {value: "", validate: function (v) { return !publishes(this) || /[a-z0-9]/i.test(String(v || "")); }},
        // Not set: a position cover, as every cover node was before this setting.
        coverType: {value: "position"},
        presets: {value: "{\"partial\":60}", required: true, validate: function (v) {
          try {
            var parsed = JSON.parse(v);
            return Boolean(parsed) && typeof parsed === "object" && !Array.isArray(parsed) && Object.keys(parsed).every(function (name) {
              var position = parsed[name];
              return /^[a-z][a-z0-9_-]*$/.test(name) && ["open", "close", "stop"].indexOf(name) === -1 &&
                typeof position === "number" && position >= 0 && position <= 100;
            });
          } catch (e) { return false; }
        }},
        positionTolerance: {value: 2, required: true, validate: RED.validators.number()},
        invert: {value: false},
        travelTimeoutMs: {value: 90000, required: true, validate: RED.validators.number()},
        maxAttempts: {value: 2, required: true, validate: RED.validators.number()},
        pollMs: {value: 5000, required: true, validate: RED.validators.number()},
        settleMs: {value: 5000, required: true, validate: RED.validators.number()},
        travelMs: {value: 30000, required: true, validate: RED.validators.number()},
        marginMs: {value: 10000, required: true, validate: RED.validators.number()},
        // Its name in its topics, home/<area>/cover/<name>/..., as a room
        // usually has more than one cover: no default, so two covers can't
        // share topics by leaving it alone. Needed only while it publishes.
        topicName: {value: "", validate: function (v) { return !publishes(this) || /[a-z0-9]/i.test(String(v || "")); }},
        // Off until switched on.
        publishState: {value: false},
        discovery: {value: false},
        discoveryPrefix: {value: "homeassistant", required: true, validate: function (v) { var prefix = String(v || "").trim().replace(/^\/+|\/+$/g, ""); return Boolean(prefix) && !/[+#]/.test(prefix); }},
        // How Home Assistant IDs are named; not set also means "node".
        idScheme: {value: null}
      },
      onadd: function () {
        if (this.name !== "_DEFAULT_") return;
        this.name = "";
        this.idScheme = "node";
      },
      oneditprepare: function () {
        function on(value) { return value === true || value === "true"; }
        function follow() {
          var position = $("#node-input-coverType").val() !== "open-close";
          $(".cover-position").toggle(position);
          $(".cover-open-close").toggle(!position);
        }
        $("#node-input-coverType").on("change", follow);
        follow();
        $("#node-input-publishState").prop("checked", on(this.publishState));
        $("#node-input-discovery").prop("checked", on(this.discovery));
        // Discovery describes the published state, so it needs it.
        function publishing() {
          var state = $("#node-input-publishState").prop("checked");
          if (!state) $("#node-input-discovery").prop("checked", false);
          $("#node-input-discovery").prop("disabled", !state);
        }
        $("#node-input-publishState, #node-input-discovery").on("change", publishing);
        publishing();
      },
      inputs: 1,
      outputs: 4,
      outputLabels: ["device commands", "state and results", "moving", "MQTT publications"],
      icon: "font-awesome/fa-columns",
      label: function () { return this.name || (this.area ? this.area + " " : "") + "cover"; }
    });
  })();
</script>

<script type="text/html" data-template-name="home-cover-controller">
  <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label for="node-input-area">Area</label><input type="text" id="node-input-area"></div>
  <div class="form-row">
    <label for="node-input-coverType">Cover</label>
    <select id="node-input-coverType">
      <option value="position">Takes a position (0 to 100)</option>
      <option value="open-close">Open, close and stop only</option>
    </select>
  </div>
  <div class="form-row cover-position"><label for="node-input-presets">Presets</label><input type="text" id="node-input-presets"></div>
  <div class="form-row cover-position"><label for="node-input-positionTolerance">Position tolerance</label><input type="number" id="node-input-positionTolerance"></div>
  <div class="form-row cover-position"><label for="node-input-invert">Invert positions</label><input type="checkbox" id="node-input-invert" style="display:inline-block; width:auto;"> <span>(the device reports 0 as open)</span></div>
  <div class="form-row cover-position"><label for="node-input-travelTimeoutMs">Travel timeout (ms)</label><input type="number" id="node-input-travelTimeoutMs"></div>
  <div class="form-row cover-position"><label for="node-input-pollMs">Poll interval (ms)</label><input type="number" id="node-input-pollMs"></div>
  <div class="form-row cover-position"><label for="node-input-settleMs">Settle time (ms)</label><input type="number" id="node-input-settleMs"></div>
  <div class="form-row cover-open-close"><label for="node-input-travelMs">Full travel time (ms)</label><input type="number" id="node-input-travelMs"></div>
  <div class="form-row cover-open-close"><label for="node-input-marginMs">Travel margin (ms)</label><input type="number" id="node-input-marginMs"></div>
  <div class="form-row"><label for="node-input-maxAttempts">Maximum attempts</label><input type="number" id="node-input-maxAttempts"></div>
  <div class="form-row"><label for="node-input-topicName">Name in topics</label><input type="text" id="node-input-topicName" placeholder="left, for example"></div>
  <div class="form-row"><label for="node-input-publishState">Publish state over MQTT</label><input type="checkbox" id="node-input-publishState" style="display:inline-block; width:auto;"></div>
  <div class="form-row"><label for="node-input-discovery">Home Assistant discovery</label><input type="checkbox" id="node-input-discovery" style="display:inline-block; width:auto;"> <span>(needs Publish state)</span></div>
  <div class="form-row"><label for="node-input-discoveryPrefix">Discovery prefix</label><input type="text" id="node-input-discoveryPrefix"></div>
</script>

<script type="text/html" data-help-name="home-cover-controller">
  <p>Owns one position cover: a blind, shutter or curtain motor that takes and reports a position from 0 (closed) to
    100 (open). It sends a move, confirms it from what the cover reports, retries a bounded number of times, and
    leaves a cover a person moved where they put it. A move is confirmed only once the cover has stopped at the
    target: a <code>stopped</code> motion report, or the same position for the <b>Settle time</b>, with or without
    another report. A transport that echoes the requested position as soon as the command goes doesn't end the move,
    or make the travel after it look like a person's, as long as the <b>Settle time</b> is at least how often the
    motor reports while it travels.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload</dt><dd><code>"open"</code>, <code>"close"</code> or <code>"stop"</code>; a position from 0 to 100;
      or the name of one of the <b>Presets</b>. A position the cover is already at, and still, is confirmed without
      a command.</dd>
    <dt>stopIfMoving <span class="property-type">boolean</span></dt><dd><code>true</code> for a button: if the
      cover is moving (as it reports, or while a move is unconfirmed), it stops; otherwise it does the request, such
      as <code>"open"</code>.</dd>
    <dt>respectManual <span class="property-type">boolean</span></dt><dd><code>true</code> for an automatic target,
      such as a schedule or a position computed from the weather: it waits while a person's move holds the cover.
      A request without it (a button, say) takes the cover back.</dd>
    <dt>cover <span class="property-type">object</span></dt><dd>what the cover reports, as
      <code>{kind: "observed", position, motion, observedAt, battery, charging}</code>, where <code>motion</code> is
      <code>opening</code>, <code>closing</code> or <code>stopped</code> and <code>battery</code> and
      <code>charging</code> are optional. <code>{kind: "availability", online}</code> from the device's
      availability report: while it is offline nothing is sent and requests are answered <code>unavailable</code>;
      when it is back, the node reads it again before trusting anything. Also <code>{kind: "startup"}</code> after a deploy (it re-reads the cover
      rather than trusting old state), <code>{kind: "command_result", generation, ok}</code> from the device path,
      or a full request such as <code>{kind: "set_position", requestId, generation, position}</code>.</dd>
  </dl>
  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>Device commands, in a neutral shape: <code>msg.cover_command = {operation, position, requestId, generation,
      attempt}</code>, where <code>operation</code> is <code>set_position</code>, <code>stop</code> or
      <code>observe</code> (read the cover now). Wire them to a device adapter, such as the zigbee2mqtt cover or
      shelly cover node, as the example flows do.</li>
    <li>State and results: <code>msg.theatre = {kind: "target_state", target: "cover", status, details}</code>, with
      the confirmed and observed positions and any failure or manual override.</li>
    <li>Whether the cover is moving, <code>msg.payload</code> <code>true</code> or <code>false</code> with
      <code>topic</code> <code>moving</code>, sent when it changes: from the cover's own motion reports, or, for a
      device without them, while a move is unconfirmed. Wire it to other policies that should react. To pause
      motion lighting while a blind moves, send it to the motion policy's <code>pause</code> input (with
      <code>msg.owner</code>), as the example does, not its enable (<code>area-enabled</code>): that is the
      user's own switch, and a cover move must not change it.</li>
    <li>MQTT publications, when <b>Publish state</b> is on: wire it to an MQTT out node.</li>
  </ol>
  <h3>Publishing</h3>
  <p>Off unless switched on, and then named after the <b>Area</b> and the <b>Name in topics</b>, both needed then.
    The name tells this cover from others in the room and has no default, so give each cover its own. With <b>Publish state</b> it publishes, retained, the cover's
    state (<code>open</code>, <code>closed</code>, <code>opening</code>, <code>closing</code> or
    <code>stopped</code>) on <code>home/&lt;area&gt;/cover/&lt;name&gt;/state</code> and, for a position cover,
    its position on <code>…/position</code>, once it has reported, with <code>online</code> or <code>offline</code>
    on <code>…/availability</code>. It takes <code>OPEN</code>, <code>CLOSE</code> or <code>STOP</code> on
    <code>…/set</code>, and a position on <code>…/position/set</code>, as requests like any other, carried out and
    confirmed as above; wire an MQTT in node on <code>home/&lt;area&gt;/cover/&lt;name&gt;/+</code> (and
    <code>…/position/set</code>) into this node. Nothing commands the device through Home Assistant. With
    <b>Home Assistant discovery</b>, a cover entity named by <b>Name in topics</b>, with open, close and stop, and
    for a position cover also its position and set position.</p>
  <h3>Open, close and stop only</h3>
  <p>For a motor with no reliable position, set <b>Cover</b> to <i>Open, close and stop only</i>. It takes
    <code>"open"</code>, <code>"close"</code> and <code>"stop"</code> (positions and presets are ignored), and sends
    <code>open</code>, <code>close</code>, <code>stop</code> or <code>observe</code>. Its state is open, closed,
    stopped (partway) or unknown, from what it reports in
    <code>msg.cover = {kind: "observed", motion, state, observedAt}</code>, where <code>state</code> is an end state
    (<code>open</code> or <code>closed</code>) if the device reports one:</p>
  <ul>
    <li>A reported end state confirms a move.</li>
    <li>Without one, a move it reported making the right way, that stopped after at least the <b>Full travel
      time</b>, counts as done, shown as judged <i>by travel time</i>.</li>
    <li>Stopping sooner, or moving the other way, is a person's move: the cover is left alone until a newer
      request.</li>
    <li>A cover that reports nothing is <i>unconfirmed</i> after its retries (failed, with reason
      <code>no-reports</code>, for the theatre): nothing is assumed.</li>
  </ul>
  <p>Battery and charging status, when the cover reports them, are kept as facts and shown in the status; the node
    never acts on them.</p>
</script>
