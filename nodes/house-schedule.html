<script type="text/javascript">
  (function () {
    function clock(v) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(v || "").trim()); }
    // The schedule rooms share: a config node, with no wires.
    RED.nodes.registerType("home-house-schedule", {
      category: "config",
      defaults: {
        // Also its name in topics, home/<name>/schedule/...
        name: {value: "house", required: true, validate: function (v) { return /[a-z0-9]/i.test(String(v || "")); }},
        wakeTime: {value: "07:00", required: true, validate: clock},
        bedTime: {value: "23:00", required: true, validate: function (v) { return clock(v) && String(v).trim() !== String($("#node-config-input-wakeTime").val() || this.wakeTime || "").trim(); }}
      },
      label: function () { return this.name || "house schedule"; }
    });
  })();
</script>

<script type="text/html" data-template-name="home-house-schedule">
  <div class="form-row"><label for="node-config-input-name">Name</label><input type="text" id="node-config-input-name" placeholder="house"></div>
  <div class="form-row"><label for="node-config-input-wakeTime">Wake time</label><input type="text" id="node-config-input-wakeTime" placeholder="07:00"></div>
  <div class="form-row"><label for="node-config-input-bedTime">Bed time</label><input type="text" id="node-config-input-bedTime" placeholder="23:00"></div>
</script>

<script type="text/html" data-help-name="home-house-schedule">
  <p>One wake and bed time shared by every circadian lighting policy whose <b>Schedule</b> is this one. A policy
    that keeps its own times (for a child's room, say) chooses none.</p>
  <p>The policies hear of every change as it happens, without wires. Times change from a message or from Home Assistant
    through a <i>house schedule MQTT</i> node; a time changed that way lasts until this schedule is deployed with a
    different <b>Wake time</b> or <b>Bed time</b>, which then applies.</p>
  <p>The <b>Name</b> labels it and names its topics, <code>home/&lt;name&gt;/schedule/...</code>.</p>
</script>
